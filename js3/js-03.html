<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
</head>

<body>

    <div id="rakit"></div>

    <script>
        //tehtävä 1
        const luku1 = parseInt(prompt("luku1"));
        const luku2 = parseInt(prompt("luku2"));
        const luku3 = parseInt(prompt("luku3"));
        const luku4 = parseInt(prompt("luku4"));
        const luku5 = parseInt(prompt("luku5"));

        const luvut = [luku1, luku2, luku3, luku4, luku5];
        document.write(luvut + "<br>");

        for (let i = luvut.length - 1; i >= 0; i--)
            {console.log("luku:", luvut[i]);
            
            }


        //Tehtävä 3

        const koirat = [];

        for (let i = 1; i <= 6; i++) { 
        const nimi = prompt("kerro koiran" + i + " nimi");
        koirat.push(nimi);
        }

        koirat.sort((a, b) => b.localeCompare(a, "fi"));

        const kohdeElementti = document.getElementById("rakit");
            if (kohdeElementti) {
            kohdeElementti.innerHTML = koirat.join("<br>");
            }
        //tehtävä 6

        function RNG() {
            const RNGLista = [];
            let random;

                while (true) {
                random = Math.floor(Math.random() * 6) + 1;
                RNGLista.push(random);

                if (random === 6){
                    break;}
                }
        return RNGLista;
        }
        const tulos = RNG();

        document.write(tulos + "<br>");

        //tehtävä 7

        const nopan_sivut = parseInt(prompt("anna sivujen määrä: "))



        function nopan_heitto(max) {
            return Math.floor(Math.random() * max) + 1;
        }
        
        const tulos_lista = []
        let heitto;

        while (heitto !== nopan_sivut) {
            heitto = nopan_heitto(nopan_sivut);
            tulos_lista.push(heitto);
        }

        document.write(tulos_lista)


    </script>

    
</body>


</html>
